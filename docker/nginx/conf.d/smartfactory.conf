upstream smartfactory_laravel_fpm {
    server laravel-app:9000;
    keepalive 16;
}

upstream smartfactory_erp_fpm {
    server sage-erp-simulator:9000;
    keepalive 8;
}

map $http_x_request_id $smartfactory_request_id {
    default $http_x_request_id;
    "" $request_id;
}

map $http_x_forwarded_proto $smartfactory_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/smartfactory/public;
    index index.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /api/metrics { return 404; }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass smartfactory_laravel_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_REQUEST_ID $smartfactory_request_id;
        fastcgi_param HTTP_X_FORWARDED_PROTO $smartfactory_forwarded_proto;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /srv/simulator/public;
    index index.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /api/metrics { return 404; }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass smartfactory_erp_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/simulator/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/simulator/public;
        fastcgi_param HTTP_X_REQUEST_ID $smartfactory_request_id;
        fastcgi_param HTTP_X_FORWARDED_PROTO $smartfactory_forwarded_proto;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ClusterIP-only Prometheus gateways. These ports are not exposed by Ingress.
server {
    listen 8084;
    listen [::]:8084;
    server_name _;

    location = /metrics {
        access_log off;
        include fastcgi_params;
        fastcgi_pass smartfactory_laravel_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI /api/metrics;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_X_REQUEST_ID $smartfactory_request_id;
        fastcgi_param HTTP_X_FORWARDED_PROTO http;
        fastcgi_read_timeout 15s;
        fastcgi_send_timeout 15s;
    }

    location / { return 404; }
}

server {
    listen 8085;
    listen [::]:8085;
    server_name _;

    location = /metrics {
        access_log off;
        include fastcgi_params;
        fastcgi_pass smartfactory_erp_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/simulator/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/simulator/public;
        fastcgi_param REQUEST_URI /api/metrics;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_X_REQUEST_ID $smartfactory_request_id;
        fastcgi_param HTTP_X_FORWARDED_PROTO http;
        fastcgi_read_timeout 15s;
        fastcgi_send_timeout 15s;
    }

    location / { return 404; }
}
