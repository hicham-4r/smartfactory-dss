apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: laravel-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laravel-app
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: laravel-app
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: laravel
          image: smartfactory/laravel:25f0f2-static-metrics-redis
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: laravel-runtime
            - configMapRef:
                name: laravel-config
          ports:
            - name: fastcgi
              containerPort: 9000
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/html/storage
            - name: ai-datasets
              mountPath: /var/lib/smartfactory-ai/datasets
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: laravel-storage
          persistentVolumeClaim:
            claimName: laravel-storage
        - name: ai-datasets
          persistentVolumeClaim:
            claimName: ai-datasets
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-ai
        app.kubernetes.io/component: ai-service
    spec:
      serviceAccountName: fastapi-ai
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fastapi
          image: smartfactory/fastapi-ai:25d2g2-3ea78d65231b
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: fastapi-runtime
            - configMapRef:
                name: fastapi-config
          ports:
            - name: http
              containerPort: 8001
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: ai-runtime
              mountPath: /var/lib/smartfactory-ai
            - name: ai-datasets
              mountPath: /var/lib/smartfactory-ai/datasets
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: ai-runtime
          persistentVolumeClaim:
            claimName: ai-runtime-data
        - name: ai-datasets
          persistentVolumeClaim:
            claimName: ai-datasets
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-erp-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sage-erp-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sage-erp-simulator
        app.kubernetes.io/component: erp-simulator
    spec:
      serviceAccountName: sage-erp-simulator
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: erp-simulator
          image: smartfactory/erp-simulator:25f0f2-static-metrics-redis
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: erp-simulator-runtime
            - configMapRef:
                name: erp-simulator-config
          ports:
            - name: fastcgi
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: simulator-storage
              mountPath: /var/www/simulator/storage
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: simulator-storage
          persistentVolumeClaim:
            claimName: simulator-storage
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/component: edge
    spec:
      serviceAccountName: nginx
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: smartfactory/nginx:25d2-1b1f16ca1bce
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8080
            - name: erp-api
              containerPort: 8082
            - name: laravel-metrics
              containerPort: 8084
            - name: erp-metrics
              containerPort: 8085
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 16Mi
