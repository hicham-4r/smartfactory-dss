apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartfactory
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - smartfactory.local
        - localhost
      secretName: smartfactory-local-tls
  rules:
    - host: smartfactory.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: web
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: web
