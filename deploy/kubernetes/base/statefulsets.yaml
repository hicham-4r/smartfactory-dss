apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-dss
spec:
  serviceName: mysql-dss
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-dss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-dss
        app.kubernetes.io/component: dss-database
    spec:
      serviceAccountName: mysql-dss
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.4.10
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mysql-dss-runtime
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1280Mi
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d/zz-smartfactory.cnf
              subPath: zz-smartfactory.cnf
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dss-mysql-data
        - name: mysql-config
          configMap:
            name: mysql-shared-config
---
